name: Build All Platforms

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (All Platforms)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Tycho p2 repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/p2
          key: tycho-p2-${{ hashFiles('releng/target_platform/target_platform.target') }}
          restore-keys: |
            tycho-p2-

      - name: Build with Maven/Tycho (all platforms)
        run: |
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            mvn -B clean verify \
              -DskipTests \
              --no-transfer-progress \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true \
              -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
              -Dmaven.wagon.rto=120000 && break
            if [ $attempt -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            echo "Attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"

      - name: List produced artifacts (debug)
        if: always()
        run: |
          echo "=== Product ZIPs ==="
          find releng/product/target/products -type f | sort || echo "(directory not found)"
          echo "=== Update site ==="
          find releng/update/target/repository -type f | sort || echo "(directory not found)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: RSSOwlnix-Windows-x64
          path: releng/product/target/products/RSSOwlnix-win32.win32.x86_64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: RSSOwlnix-Linux-x64
          path: releng/product/target/products/RSSOwlnix-linux.gtk.x86_64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: RSSOwlnix-macOS-x64
          path: releng/product/target/products/RSSOwlnix-macosx.cocoa.x86_64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload P2 update site artifact
        uses: actions/upload-artifact@v6
        with:
          name: p2-update-site
          path: releng/update/target/repository/
          retention-days: 30
          if-no-files-found: error

      - name: Upload P2 nls site artifact
        uses: actions/upload-artifact@v6
        with:
          name: p2-nls-site
          path: releng/update-nls/target/repository/
          retention-days: 30
          if-no-files-found: error

      - name: Upload P2 addons site artifact
        uses: actions/upload-artifact@v6
        with:
          name: p2-addons-site
          path: releng/update-addons/target/repository/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RSSOwlnix-Windows-x64/*.zip
            artifacts/RSSOwlnix-Linux-x64/*.tar.gz
            artifacts/RSSOwlnix-macOS-x64/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-p2:
    name: Publish P2 Update Site
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository (for CHANGELOG.md and script)
        uses: actions/checkout@v5

      - name: Generate updates.rss from CHANGELOG.md
        run: |
          bash generate-updates-rss.sh CHANGELOG.md updates.rss
          echo "--- generated feed preview ---"
          head -40 updates.rss

      - name: Copy feed icon
        run: cp org.rssowl.ui/icons/product/256x256.png rssowl.png

      - name: Download P2 program site artifact
        uses: actions/download-artifact@v8
        with:
          name: p2-update-site
          path: p2-program

      - name: Download P2 nls site artifact
        uses: actions/download-artifact@v8
        with:
          name: p2-nls-site
          path: p2-nls

      - name: Download P2 addons site artifact
        uses: actions/download-artifact@v8
        with:
          name: p2-addons-site
          path: p2-addons

      - name: Deploy program update site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: p2-program
          destination_dir: update/program
          keep_files: true

      - name: Deploy nls update site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: p2-nls
          destination_dir: update/nls
          keep_files: true

      - name: Deploy addons update site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: p2-addons
          destination_dir: update/addons
          keep_files: true

      - name: Deploy updates.rss and feed icon to GitHub Pages root
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          include_files: updates.rss,rssowl.png
          destination_dir: .
          keep_files: true



