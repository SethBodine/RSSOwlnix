name: CodeQL Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Friday at 13:20 UTC
    - cron: '20 13 * * 5'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL Analysis (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Tycho p2 repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/p2
          key: tycho-p2-${{ hashFiles('releng/target_platform/target_platform.target') }}
          restore-keys: |
            tycho-p2-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          # security-extended adds extra queries beyond the default security suite,
          # including the CWE-78, CWE-22 and CWE-327 rules that flagged the issues
          # already fixed in this codebase.
          queries: security-extended

      - name: Build with Maven/Tycho
        run: |
          for attempt in 1 2 3; do
            echo "=== CodeQL build attempt $attempt ==="
            mvn -B clean verify \
              -DskipTests \
              --no-transfer-progress \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true \
              -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
              -Dmaven.wagon.rto=120000 && break
            if [ $attempt -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            echo "Attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

