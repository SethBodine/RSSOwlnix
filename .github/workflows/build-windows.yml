name: Build Windows Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload build artifact'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write   # needed to create releases on tag pushes

jobs:
  build-windows:
    name: Build Windows ZIP
    runs-on: ubuntu-latest   # Tycho cross-compiles; no Windows runner needed

    steps:
      #  Checkout 
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # jgit timestamp provider needs full history

      #  Java 
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      #  Cache Eclipse p2 artifacts 
      # The Tycho p2 local repository lives separately from the Maven cache.
      # Caching it means the Eclipse CDN only needs to be hit once successfully
      # rather than on every run.
      - name: Cache Tycho p2 repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/p2
          key: tycho-p2-${{ hashFiles('releng/target_platform/target_platform.target') }}
          restore-keys: |
            tycho-p2-

      #  Maven / Tycho build (Windows target only) 
      - name: Build with Maven/Tycho (Windows only)
        run: |
          # Retry the build up to 3 times to handle transient Eclipse CDN failures
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            mvn -B clean verify \
              -Denvironments="win32,win32,x86_64" \
              -DskipTests \
              --no-transfer-progress \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -Dmaven.wagon.http.retryHandler.requestSentRetryEnabled=true \
              -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 \
              -Dmaven.wagon.rto=120000 && break
            if [ $attempt -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            echo "Attempt $attempt failed, waiting 30s before retry..."
            sleep 30
          done
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+UseParallelGC"

      #  Locate the produced ZIP 
      - name: Find Windows ZIP artifact
        id: find_zip
        run: |
          ZIP=$(find releng/product/target/products -name "RSSOwlnix*win32*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no Windows ZIP found under releng/product/target/products"
            find releng/product/target -name "*.zip" || true
            exit 1
          fi
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename $ZIP)" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      #  Upload as workflow artifact (always, for traceability) 
      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: RSSOwlnix-Windows-x64
          path: ${{ steps.find_zip.outputs.zip_path }}
          retention-days: 30
          if-no-files-found: error

      #  Create GitHub Release on version tag (e.g. v2.5.1) 
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_zip.outputs.zip_path }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

